# Shared config for the K=1 and K=4 arms. K is set on the command line by
# run-arms.sh, so the two arms differ in exactly one parameter.
#
# Every setting here was established by local measurement on Qwen3.8-27B, not
# inherited from config.default.toml -- the defaults are wrong for this model.

model = "Qwen/Qwen3.8-27B"
seed = 12345

# Fit AND score at the answer position. The refusal direction that works lives
# there: recovered from trohrbaugh's released weights, his direction is 0.87-0.92
# collinear with the thinking-off direction and only ~0.25 with any thinking-on
# variant. Fitting at the reasoning position produces an abliteration that does
# essentially nothing (measured: 81-86/100 refusals vs 44/100 at the answer
# position, same parameters).
chat_template_kwargs = { enable_thinking = false }

# Skip the automatic prefix check, which costs 200 generations before trial 1.
response_prefix = ""

# 64, not 128: at 128 the GatedDeltaNet activations push peak VRAM to ~84 GB and
# OOM an 80 GB card. Also note refusal counts are only comparable ACROSS RUNS at
# a fixed batch size -- left-padding means batch composition changes each prompt's
# padding, which shifts logits and flips borderline greedy decodes. The same base
# model scored 88, 93 and 100/100 across three of our harnesses for this reason.
batch_size = 64
max_batch_size = 64
max_response_length = 100
system_prompt = "You are a helpful assistant."

dtypes = ["auto", "bfloat16", "float16", "float32"]
quantization = "none"
device_map = "auto"
offload_outputs_to_cpu = true

# From the 2x2 on this model (baseline 88/100):
#   none/true 44 | full/true 52 | full/false 64 | none/false 69
# Orthogonalization HELPS here, the opposite of gemma-3-12b, which the low
# S(g,r) (0.18-0.27 against gemma's 0.957-0.985) predicted.
row_normalization = "none"
orthogonalize_direction = true

# The search space is 14 parameters now, not 10: direction_scope, direction_index, and
# four each for attn.o_proj, linear_attn.out_proj and mlp.down_proj, since the hybrid
# model's two attention operators are optimized separately. Startup trials are random,
# so they are what maps a space this size before TPE starts exploiting; 100 of 400 is the
# same quarter the previous run used. The extra budget is also the answer to whether the
# 200-trial run simply stopped early -- its Pareto front was still improving at trial 193.
n_trials = 400
n_startup_trials = 100

# ALL THREE are required for an unattended run. Missing trial_index leaves
# heretic blocked on the "Which trial do you want to use?" menu reading a pipe:
# one CPU thread spinning, GPU at 0%, no error, billing the whole time.
checkpoint_action = "restart"
trial_index = 0
model_action = ""

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize", instance_name = "refusals" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
    # Monitor only: NSFW is near-orthogonal to harmful_behaviors (0.687-0.818),
    # so the optimized pair structurally cannot see whether that path moved.
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none", instance_name = "nsfw" },
]

[scorer.KeywordRate_nsfw.prompts]
dataset = "/workspace/data/nsfw-val"
split = "train"
column = "text"

[good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:400]"
column = "text"

[bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:400]"
column = "text"
